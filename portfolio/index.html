<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Siddhant Singh — Software Developer & AI/ML Specialist</title>
    <meta name="description" content="Portfolio of Siddhant Singh — Software Developer at Everbridge specializing in Distributed Systems, High-Throughput Microservices, and AI/ML based in Bangalore." />

    <!-- Resolve the theme before first paint so neither mode flashes the other -->
    <script>
      (function () {
        var preference = 'system';
        try {
          var stored = localStorage.getItem('portfolio-theme');
          if (stored === 'light' || stored === 'dark') preference = stored;
        } catch (e) {}

        var dark = preference === 'dark' || (
          preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches
        );
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    
    <!-- Google Fonts: Kalam (Headings) & Patrick Hand (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-paper text-ink font-body antialiased selection:bg-postit selection:text-on-postit">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
